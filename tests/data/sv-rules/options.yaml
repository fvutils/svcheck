sv-rules:
  defaults:
    tier: style
  rules:
    - id: ACME001
      name: all-option-types
      summary: s
      message: "limit ${options.limit}, ${options.pattern}"
      options:
        limit: { type: int, default: 3, help: "The limit" }
        pattern: { default: "^[a-z]+$" }
        strict: { type: bool, default: false }
        names: { type: string-list, default: [a, b] }
        mode: { type: string, default: fast, choices: [fast, slow] }
      match: { kind: BinaryExpressionSyntax }
      where: >-
        options.limit > 0 && !options.strict && options.names.size() == 2 &&
        options.mode == "fast" && "abc".matches(options.pattern)
    - id: ACME002
      name: option-errors
      summary: s
      message: m
      options:
        bad-name: { default: 1 }
        badtype: { type: float, default: 1.0 }
        nodefault: { type: int }
        wrongdefault: { type: int, default: "3" }
        notinchoices: { default: c, choices: [a, b] }
        notamap: 3
      match: { kind: BinaryExpressionSyntax }

