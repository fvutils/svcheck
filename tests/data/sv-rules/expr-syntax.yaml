sv-rules:
  defaults:
    tier: style
  rules:
    - id: ACME001
      name: where-syntax
      summary: s
      message: m
      match: { kind: BinaryExpressionSyntax }
      where: >-
        node.operatorToken.kind == TokenKind.DoubleEquals &&
        node.left ==
    - id: ACME002
      name: message-unterminated
      summary: s
      message: "the value ${node.operatorToken.kind is wrong"
      match: { kind: BinaryExpressionSyntax }
    - id: ACME003
      name: message-syntax
      summary: s
      message: "the value ${node.operatorToken.kind +} is wrong"
      match: { kind: BinaryExpressionSyntax }
    - id: ACME004
      name: outside-profile
      summary: s
      message: m
      match: { kind: BinaryExpressionSyntax }
      where: node.operatorToken.kind == uint(1)
    - id: ACME005
      name: let-syntax
      summary: s
      message: m
      match: { kind: BinaryExpressionSyntax }
      let:
        a: "[1, 2"
    - id: ACME006
      name: message-empty
      summary: s
      message: "nothing ${ } here"
      match: { kind: BinaryExpressionSyntax }

