sv-rules:
  defaults:
    tier: style
  rules:
    - id: ACME001
      name: let-in-order
      summary: s
      message: "${a} and ${b}"
      match: { kind: BinaryExpressionSyntax }
      let:
        a: node.operatorToken.kind
        b: a + 1
      where: b > a
    - id: ACME002
      name: let-out-of-order
      summary: s
      message: m
      match: { kind: BinaryExpressionSyntax }
      let:
        a: b + 1
        b: "1"
    - id: ACME003
      name: let-reserved
      summary: s
      message: m
      match: { kind: BinaryExpressionSyntax }
      let:
        node: "1"
        finding: "2"
    - id: ACME004
      name: let-bad-type-later-use
      summary: s
      message: m
      match: { kind: BinaryExpressionSyntax }
      let:
        a: node.nothere
        b: a + 1

# expect: SVCHK215 error @ 20:12 undeclared reference to 'b'
# expect: SVCHK212 error @ 28:9 'let' cannot define 'node', which every rule already has
# expect: SVCHK212 error @ 29:9 'let' cannot define 'finding', which every rule already has
