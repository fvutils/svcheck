#****************************************************************************
#* unit.yaml -- context units (sv-contexts.md; svcheck-plan R-6). Declared in
#* P1.3; filled by the classify stage (P1.4, src/host/SvContext.cpp).
#****************************************************************************
enums:
- UnitDepKind:
    doc: What a UnitDep comes from.
    values:
    - Import: "a package import"
    - TypeRef: "a reference to a type declared in the other unit"
    - Include: "an `include` of the other unit's file"
    - HierRef: "a hierarchical reference"
    - VirtualInterface: "a virtual interface of the other unit's interface"

classes:
- Unit:
    super: SemNode
    doc: |
        A context unit: one or more carriers (packages, definitions,
        classes) with their labels (sv-contexts.md §2). Carriers with the
        same unit name are one unit: a classifier's `joins:` gives the
        carriers it joins its name (Q-CX5's starting point).

        Attributes:
            name: the unit's name (`apb` in `agent(apb)`): a tag's, a classifier's `name:`, else the carrier's
            labels: its labels, on every axis, each once
            carriers: the carriers it is made of
            evidence: where each label came from, one line each: `unit agent: Content (r.yaml:12) on Package apb_pkg`
    data:
    - name:
        type: string
        is_ctor: false
    - labels:
        type: list<string>
        is_ctor: false
    - carriers:
        type: list<P<Decl>>
        is_ctor: false
    - evidence:
        type: list<string>
        is_ctor: false

- UnitDep:
    super: SemNode
    doc: A dependency of one unit on another (sv-contexts.md §4.2).
    data:
    - kind:
        type: UnitDepKind
        is_ctor: false
        init: UnitDepKind::Import
    - from:
        type: P<Unit>
        is_ctor: false
    - to:
        type: P<Unit>
        is_ctor: false
