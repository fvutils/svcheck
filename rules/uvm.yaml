# The UVM vocabulary (svcheck-design §5.1; sv-uvm-rules-assessment §2.1): the
# helpers the built-in UVM pack reads through `uses: [uvm.yaml]`. A user's rule
# file names it the same way: a bare `uses:` name that is not a file beside the
# rule file is a built-in helper file. Grown from rules/spike/uvm-vocab.yaml
# (svcheck-plan P2.5). It holds no rules, so it is not loaded as a pack. Its
# classifiers (`contexts:`, at the end) take part in a run that selects a
# rule of a built-in file (the pack's), or of a user file that uses it.
sv-rules:
  version: 1
  define:
    # c is the UVM class `base` or derives from it ("uvm_object", ...).
    is(c, base): derives_from(c, "uvm_pkg::" + base)
    # The class, and the subroutine, a node is in (null outside one).
    cls(n): enclosing(n, Class)
    method(n): enclosing(n, Subroutine)
    # Method m of class c is called from c's `phase` method (a helper of that
    # phase), one level deep.
    helper_of(m, c, phase): >-
      m != null && c != null && descendants(c, Call).exists(k,
        k.subroutine == m && method(k) != null && method(k).name == phase)
    # Class c registers itself with the factory: it declares its own
    # `type_id`, as the utils macros do. An inherited one creates the base.
    registered(c): c.members.exists(m, m.name == "type_id")
    # Another package derives from class c: c is a base class of a library
    # (lowRISC's dv_base_*), not a unit (svcheck-plan P1-34).
    based(c): subclasses(c).exists(s, s.carrier != c.carrier)
    # Expression e is `this` (as an argument, through a conversion to the
    # formal's type).
    is_this(e): >-
      (e.isa(NamedValue) && e.name == "this") ||
      (e.isa(Conversion) && e.operand.isa(NamedValue) && e.operand.name == "this")

    # ---- Roles. A component is also a uvm_object; is_object leaves it out.
    is_component(c): is(c, "uvm_component")
    is_object(c): is(c, "uvm_object") && !is(c, "uvm_component")
    is_sequence(c): is(c, "uvm_sequence_base")
    # A sequence item: not a sequence, which is also a uvm_sequence_item.
    is_item(c): is(c, "uvm_sequence_item") && !is(c, "uvm_sequence_base")
    is_driver(c): is(c, "uvm_driver")
    is_monitor(c): is(c, "uvm_monitor")
    is_env(c): is(c, "uvm_env")
    is_test(c): is(c, "uvm_test")
    is_scoreboard(c): is(c, "uvm_scoreboard")
    # TLM ports, exports and imps: built with new() by convention.
    is_port(c): is(c, "uvm_port_base")

    # ---- Phases: the common phases, as methods of uvm_component.
    PHASES: >-
      ["build_phase", "connect_phase", "end_of_elaboration_phase",
       "start_of_simulation_phase", "run_phase", "extract_phase", "check_phase",
       "report_phase", "final_phase"]
    # The run-time phases, which run in parallel with run_phase.
    RUN_PHASES: >-
      ["pre_reset_phase", "reset_phase", "post_reset_phase", "pre_configure_phase",
       "configure_phase", "post_configure_phase", "pre_main_phase", "main_phase",
       "post_main_phase", "pre_shutdown_phase", "shutdown_phase", "post_shutdown_phase"]

    # ---- Calls.
    # The value of call c is thrown away: a call statement, or a void cast.
    discarded(c): parent(c).isa(ExprStmt) || void_cast(parent(c))
    void_cast(e): e.isa(Conversion) && e.type.name == "void"
    # Call k is a static method of uvm_config_db#(T): set, get, exists, wait_modified.
    config_db(k): >-
      k.classType != null && k.classType.classDecl != null &&
      k.classType.classDecl.qname == "uvm_pkg::uvm_config_db"
    # Call k is `T::type_id::create(...)`, the factory's create of a
    # registered class; k.type is T.
    factory_create(k): >-
      k.isa(Call) && k.name == "create" && k.classType != null &&
      k.classType.classDecl != null &&
      k.classType.classDecl.qname in ["uvm_pkg::uvm_component_registry", "uvm_pkg::uvm_object_registry"]
    # Call k's result is thrown away, written as a plain call statement (not
    # `void'(...)`, which throws it away on purpose).
    unchecked(k): parent(k).isa(ExprStmt) && !stmt_void(parent(k))
    stmt_void(s): s.isa(ExprStmt) && s.isVoidCast

    # ---- Contexts (sv-contexts.md; svcheck-plan P1.6b, P2.4). The unit axis,
    # by content only: a unit's kind comes from what its classes derive from.
    # Convention (names) never selects (Q-CX4); P2.6's presets add it, for the
    # consistency rule. Library code is not classified (P1-21).
    #
    # A class another package derives from is a base, not a unit: its package
    # is `base-lib` (OpenTitan's dv_lib and cip_lib, which hold dv_base_env
    # and dv_base_test; P1-34).
    is_config_db(t): >-
      t != null && t.classDecl != null && t.classDecl.qname == "uvm_pkg::uvm_config_db"
    holds(p, base): classes(p).exists(c, !based(c) && is(c, base))
    user(c): "!c.inLibrary && !based(c)"
  contexts:
    # Classes: the innermost carriers, so an in-context rule reads a class's
    # own kind in a mixed package (Q-CX3).
    - { label: agent, axis: unit, carrier: Class,
        when: 'user(carrier) && is(carrier, "uvm_agent")' }
    - { label: env, axis: unit, carrier: Class,
        when: 'user(carrier) && is(carrier, "uvm_env")' }
    - { label: test, axis: unit, carrier: Class,
        when: 'user(carrier) && is(carrier, "uvm_test")' }
    # An agent's parts (Q-CX5, P2.4): in a mixed package a class's context is
    # what it is. A sequencer is not one: an env's virtual sequencer is a
    # uvm_sequencer too. Nor is a scoreboard an env's: CORE-V's uvml_sb_pkg is
    # a library of them, which became an env.
    - { label: agent, axis: unit, carrier: Class,
        when: 'user(carrier) && (is(carrier, "uvm_driver") || is(carrier, "uvm_monitor"))' }
    # Packages, on the same evidence, so that content and convention meet on
    # one carrier and a disagreement is noted (Q-CX4).
    - label: agent
      axis: unit
      carrier: Package
      when: '!carrier.inLibrary && holds(carrier, "uvm_agent")'
      # Two content joins (Q-CX5): an interface the package fetches from
      # config_db as a virtual interface (lowRISC), and one a class of the
      # package is specialised with, wherever that is (fwvip's config_p
      # classes, specialised in the tb top; P2.4).
      joins: >-
        calls_in(carrier).filter(c, c.name == "get" && is_config_db(c.classType)
          && c.classType.args.size() > 0 && c.classType.args[0].isVirtualInterface)
        .map(c, c.classType.args[0].ifaceDecl)
        + classes(carrier).map(k, specializations(k)).flatten()
          .map(t, t.args.filter(a, a.isVirtualInterface)).flatten()
          .map(a, a.ifaceDecl)
    - { label: env, axis: unit, carrier: Package,
        when: '!carrier.inLibrary && holds(carrier, "uvm_env")' }
    - { label: test, axis: unit, carrier: Package,
        when: '!carrier.inLibrary && holds(carrier, "uvm_test")' }
    - { label: base-lib, axis: unit, carrier: Package,
        when: '!carrier.inLibrary && classes(carrier).exists(c, based(c) && is(c, "uvm_component"))' }
    # A package of sequences (and their items) with no component: a sequence
    # library. A package with an agent or env and its sequences is that unit.
    - label: seq-lib
      axis: unit
      carrier: Package
      when: >-
        !carrier.inLibrary && holds(carrier, "uvm_sequence_base") &&
        !classes(carrier).exists(c, is(c, "uvm_component"))
    # A package of register blocks with no component: a register model.
    - label: regmodel
      axis: unit
      carrier: Package
      when: >-
        !carrier.inLibrary && holds(carrier, "uvm_reg_block") &&
        !classes(carrier).exists(c, is(c, "uvm_component"))
    # A module that starts UVM.
    - label: tb-top
      axis: unit
      carrier: Definition
      when: >-
        !carrier.inLibrary && carrier.kind == DefinitionKind.Module &&
        calls_in(carrier).exists(c, c.name == "run_test")
