sv-rules:
  defaults:
    tier: style
  rules:
    - id: ACME001
      name: example-forms
      summary: s
      message: m
      match: { kind: BinaryExpressionSyntax }
      examples:
        - name: line comment, block comment, positions
          code: |
            module top;
              // expect: ACME001 @ 3:5, ACME001
              /* expect: ACME001 */ int x;
            endmodule
        - name: two files
          files:
            a.sv: |
              import b::*;   // expect: ACME001
            b.sv: |
              package b; endpackage
        - name: none
          code: "module top; endmodule // expect: none"
    - id: ACME002
      name: example-errors
      summary: s
      message: m
      match: { kind: BinaryExpressionSyntax }
      examples:
        - name: malformed
          code: |
            module top; endmodule  // expect: ACME002 @ x:1
        - name: other rule
          code: |
            module top; endmodule  // expect: ACME001
        - name: both
          code: "x"
          files: { a.sv: "x" }
        - name: neither
        - name: none and a finding
          code: "module top; endmodule // expect: none, ACME002"

# expect: SVCHK212 error @ 33:47 malformed expectation 'ACME002 @ x:1' in example 'malformed'; write '// expect: ACME002', optionally with '@ line:col'
# expect: SVCHK212 error @ 36:47 example 'other rule' expects ACME001, but an example runs only its own rule, ACME002
# expect: SVCHK212 error @ 37:11 example 'both' has both 'code' and 'files'; use one
# expect: SVCHK212 error @ 40:11 example 'neither' has neither 'code' nor 'files'
# expect: SVCHK212 error @ 42:50 'expect: none' together with expected findings, in example 'none and a finding'
# loads: ACME001
