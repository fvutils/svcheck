# The 4 UVM rules of svcheck-plan P1.3 (sv-uvm-rules-assessment §4), against
# the curated model (svcheck-design §3.6). For Q-SC5: set against
# uvm-slang.yaml, which has the same rules against slang's own AST.
sv-rules:
  version: 1
  defaults:
    tier: suspicious
  define:
    is(c, base): derives_from(c, "uvm_pkg::" + base)
    PHASES: >-
      ["build_phase", "connect_phase", "end_of_elaboration_phase",
       "start_of_simulation_phase", "run_phase", "extract_phase", "check_phase",
       "report_phase", "final_phase"]
  rules:
    - id: UVM001
      name: unregistered-uvm-class
      summary: A UVM object or component class is not registered with the factory
      message: "'${node.name}' is a UVM class but is not registered with the factory"
      match: { kind: Class }
      where: >-
        !node.inLibrary && !node.isAbstract && is(node, "uvm_object") &&
        !node.members.exists(m, m.name == "type_id")

    - id: UVM010
      name: uvm-object-new
      summary: A UVM object or component is constructed with new() instead of the factory
      message: "${node.type.name} is constructed with new(); use type_id::create"
      match: { kind: NewClass }
      where: >-
        is(node.type.classDecl, "uvm_object") && !is(node.type.classDecl, "uvm_port_base") &&
        enclosing(node, Subroutine).name != "create"

    - id: UVM020
      name: unchecked-randomize
      summary: The result of randomize() is ignored
      message: randomize() result is not checked
      match: { kind: Call }
      let:
        p: parent(node)
      where: >-
        node.name == "randomize" &&
        (p.isa(ExprStmt) || (p.isa(Conversion) && p.type.name == "void") ||
         ancestors(node).exists(a, a.isa(ImmediateAssert)))

    - id: UVM030
      name: phase-missing-super
      summary: An overridden phase method does not call the parent's implementation
      message: "${node.name} overrides ${node.overrides.qname} but does not call it"
      match: { kind: Subroutine }
      where: >-
        node.name in PHASES && is(enclosing(node, Class), "uvm_component") &&
        node.overrides != null && !node.overrides.inLibrary &&
        !descendants(node, Call).exists(c, c.subroutine == node.overrides)
