# Site files may not use the reserved namespace, SVCHK, with or without a
# team qualifier (format §5, §5.1). A namespace that merely starts with it
# (SVCHKAC) is not reserved.
sv-rules:
  defaults:
    tier: style
  rules:
    - id: SVCHK001
      name: tool-namespace-low
      summary: s
      message: m
      match: { kind: BinaryExpressionSyntax }
    - id: SVCHK201
      name: tool-namespace-mid
      summary: s
      message: m
      match: { kind: BinaryExpressionSyntax }
    - id: SVCHK300
      name: tool-namespace
      summary: s
      message: m
      match: { kind: BinaryExpressionSyntax }
    - id: SVCHK999
      name: tool-namespace-high
      summary: s
      message: m
      match: { kind: BinaryExpressionSyntax }
    - id: SVCHK-ACME001
      name: qualified-tool-namespace
      summary: s
      message: m
      match: { kind: BinaryExpressionSyntax }
    - id: SVCHK-NET001
      name: qualified-tool-namespace-2
      summary: s
      message: m
      match: { kind: BinaryExpressionSyntax }
    - id: ACME001
      name: reserved-alias
      aliases: [SVCHK104]
      summary: s
      message: m
      match: { kind: BinaryExpressionSyntax }
    - id: SVCH001
      name: reserved-prefix-only
      summary: s
      message: m
      match: { kind: BinaryExpressionSyntax }

# expect: SVCHK217 error @ 8:11 'SVCHK001' is in the reserved namespace 'SVCHK': SVCHK belongs to svcheck, with or without a team qualifier; choose a namespace of your own, as ACME001
