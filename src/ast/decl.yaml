#****************************************************************************
#* decl.yaml -- declarations: packages, definitions, classes, members.
#****************************************************************************
enums:
- DefinitionKind:
    doc: What a Definition is.
    values:
    - Module: "`module`"
    - Interface: "`interface`"
    - Program: "`program`"

- SubroutineKind:
    doc: A function or a task.
    values:
    - Function: "`function`"
    - Task: "`task`"

- ProcessKind:
    doc: What a Process is.
    values:
    - Initial: "`initial`"
    - Final: "`final`"
    - Always: "`always`"
    - AlwaysComb: "`always_comb`"
    - AlwaysFF: "`always_ff`"
    - AlwaysLatch: "`always_latch`"

- ArgDirection:
    doc: A formal argument's direction.
    values:
    - NotArg: "not a formal argument"
    - In: "`input`, or no direction"
    - Out: "`output`"
    - InOut: "`inout`"
    - Ref: "`ref`"
    - ConstRef: "`const ref`"

classes:
- Decl:
    super: SemNode
    doc: |
        A named declaration.

        Attributes:
            name: the declared name
            qname: the name qualified by its package or definition (`uvm_pkg::uvm_object`)
            inLibrary: declared in library code (uvm_pkg, or a configured VIP); its subroutines have no bodies
            carrier: the package or definition the declaration is in, however deeply; null in `$unit`. A file included into a package (`` `include ``) is in that package (sv-contexts.md §2.2)
            tags: the context tags in the comments before a package, definition or class (`// svcheck context: agent(apb)` gives `agent(apb)`), each as written
    data:
    - name:
        type: string
        is_ctor: false
    - qname:
        type: string
        is_ctor: false
    - inLibrary:
        type: bool
        is_ctor: false
        init: false
    - carrier:
        type: P<Decl>
        rel: parent
        is_ctor: false
    - tags:
        type: list<string>
        is_ctor: false

- Package:
    super: Decl
    doc: |
        A package: a context carrier (sv-contexts.md §2.2).

        Attributes:
            imports: the packages it imports (`import p::*;` or `import p::x;`), each once
            files: the files its text comes from: its own, then each file included into it
            items: its declarations
    data:
    - imports:
        type: list<P<Package>>
        visit: false
        is_ctor: false
    - files:
        type: list<string>
        is_ctor: false
    - items:
        type: list<UP<Decl>>
        is_ctor: false

- Definition:
    super: Decl
    doc: |
        A module, interface or program definition (not an instance): a context
        carrier.

        Attributes:
            kind: module, interface or program
            imports: the packages it imports
            files: the files its text comes from
            items: its declarations: variables, subroutines, classes, processes and generate blocks, from its first instance (generate blocks: GenBlock)
    data:
    - kind:
        type: DefinitionKind
        is_ctor: false
        init: DefinitionKind::Module
    - imports:
        type: list<P<Package>>
        visit: false
        is_ctor: false
    - files:
        type: list<string>
        is_ctor: false
    - items:
        type: list<UP<Decl>>
        is_ctor: false

- Class:
    super: Decl
    doc: |
        A class declaration. A parameterised class is one Class, its generic
        body; each specialisation of it refers to this node (S-2).

        Attributes:
            base: the class it extends, or null
            supers: every class it derives from, nearest first
            interfaces: the interface classes it implements, or an interface class extends, with those they extend, and those its bases implement
            isAbstract: declared `virtual class`
            isInterface: an `interface class`
            params: the names of its parameters, value and type; empty when it has none
            members: its own members, in declaration order
    data:
    - base:
        type: P<Class>
        visit: false
        is_ctor: false
    - supers:
        type: list<P<Class>>
        visit: false
        is_ctor: false
    - interfaces:
        type: list<P<Class>>
        visit: false
        is_ctor: false
    - isAbstract:
        type: bool
        is_ctor: false
        init: false
    - isInterface:
        type: bool
        is_ctor: false
        init: false
    - params:
        type: list<string>
        is_ctor: false
    - members:
        type: list<UP<Decl>>
        is_ctor: false

- Typedef:
    super: Decl
    doc: |
        A `typedef`; `type` is the aliased type.
    data:
    - type:
        type: P<TypeRef>
        visit: false
        is_ctor: false

- Variable:
    super: Decl
    doc: |
        A variable: a class property, a package or module variable, a local
        or a subroutine argument.

        Attributes:
            type: its type
            isRand: `rand` or `randc`
            isStatic: `static`
            isConst: `const`
            direction: a formal argument's direction; NotArg for any other variable
            init: its initializer, or null; a formal argument's default value (user code only)
    data:
    - type:
        type: P<TypeRef>
        visit: false
        is_ctor: false
    - isRand:
        type: bool
        is_ctor: false
        init: false
    - isStatic:
        type: bool
        is_ctor: false
        init: false
    - isConst:
        type: bool
        is_ctor: false
        init: false
    - direction:
        type: ArgDirection
        is_ctor: false
        init: ArgDirection::NotArg
    - init:
        type: UP<Expr>
        is_ctor: false

- Subroutine:
    super: Decl
    doc: |
        A function or task, with its body for user code.

        Attributes:
            kind: function or task
            isVirtual: virtual, declared so or inherited
            isPure: `pure virtual`
            isStatic: `static`
            overrides: the base-class method it overrides, or null
            returnType: the return type; `void` for a task
            args: its formal arguments
            body: its statements, as a Block (one with a single statement too), or null (library code, a prototype)
    data:
    - kind:
        type: SubroutineKind
        is_ctor: false
        init: SubroutineKind::Function
    - isVirtual:
        type: bool
        is_ctor: false
        init: false
    - isPure:
        type: bool
        is_ctor: false
        init: false
    - isStatic:
        type: bool
        is_ctor: false
        init: false
    - overrides:
        type: P<Subroutine>
        visit: false
        is_ctor: false
    - returnType:
        type: P<TypeRef>
        visit: false
        is_ctor: false
    - args:
        type: list<UP<Variable>>
        is_ctor: false
    - body:
        type: UP<Stmt>
        is_ctor: false

- Process:
    super: Decl
    doc: |
        A procedural block of a module, interface or program (`initial`,
        `always`, ...), with its body for user code. It has no name.

        Attributes:
            kind: which block
            body: its statement, or null (library code)
    data:
    - kind:
        type: ProcessKind
        is_ctor: false
        init: ProcessKind::Initial
    - body:
        type: UP<Stmt>
        is_ctor: false

- GenBlock:
    super: Decl
    doc: |
        A generate block of a module, interface or program: a branch of a
        generate `if` or `case`, or the body of a generate `for`.

        One node per block as written, as for definitions (S-1): its items
        come from the first instance that elaborates it, so a definition
        instantiated with several parameter sets gives each block once. A
        `for` body is lowered once, from its first iteration. A block that
        no instance elaborates (a branch every instance's parameters rule
        out) is here, with `isElaborated` false and no items.

        Attributes:
            name: its label, or slang's name for an unlabelled block (`genblk1`)
            isLoop: the body of a generate `for`
            isElaborated: some instance elaborates it; else it has no items
            items: its declarations: variables, processes, nested blocks
    data:
    - isLoop:
        type: bool
        is_ctor: false
        init: false
    - isElaborated:
        type: bool
        is_ctor: false
        init: false
    - items:
        type: list<UP<Decl>>
        is_ctor: false

- OpaqueDecl:
    super: Decl
    doc: |
        A declaration the model does not curate (a constraint, a covergroup,
        a parameter, ...): slang's symbol kind, and its name.
    data:
    - slangKind:
        type: string
        is_ctor: false
