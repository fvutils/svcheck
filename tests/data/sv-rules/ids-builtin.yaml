# builtin
# A built-in rule file uses the SVCHK namespace, plain or qualified by a
# pack (SVCHK-UVM; format §5, svcheck-plan R-7), and nothing else.
sv-rules:
  defaults:
    tier: style
    family: process
  rules:
    - id: ACME001
      name: site-namespace
      summary: s
      message: m
      doc: d
      match: { kind: BinaryExpressionSyntax }
      examples:
        - code: |
            component top { }   // expect: ACME001
        - code: |
            component top { }
    - id: SVCHK-UVM001
      name: pack-svchk
      summary: s
      message: m
      doc: d
      match: { kind: BinaryExpressionSyntax }
      examples:
        - code: |
            component top { }   // expect: SVCHK-UVM001
        - code: |
            component top { }
    - id: SVCHK950
      name: plain-svchk
      summary: s
      message: m
      doc: d
      match: { kind: BinaryExpressionSyntax }
      examples:
        - code: |
            component top { }   // expect: SVCHK950
        - code: |
            component top { }

# expect: SVCHK217 error @ 9:11 'ACME001' is in namespace 'ACME'; a built-in rule's IDs are in the SVCHK namespace, or a pack's (SVCHK-UVM)
# loads: SVCHK-UVM001, SVCHK950
