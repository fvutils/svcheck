# builtin
sv-rules:
  defaults:
    tier: style
  rules:
    - id: SVCHK901
      name: missing-builtin-fields
      summary: s
      message: m
      match: { kind: BinaryExpressionSyntax }
    - id: SVCHK902
      name: only-firing-examples
      family: process
      summary: s
      message: m
      doc: d
      match: { kind: BinaryExpressionSyntax }
      examples:
        - code: |
            component top { }   // expect: SVCHK902
    - id: SVCHK903
      name: complete-builtin
      family: process
      summary: s
      message: m
      doc: d
      match: { kind: BinaryExpressionSyntax }
      examples:
        - name: fires
          code: |
            component top { }   // expect: SVCHK903
        - name: near miss
          code: |
            component top { }

